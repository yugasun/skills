name: New skill request
description: Propose a new skill for this repository
title: "[request]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What task should the skill help agents perform?
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: When should the skill trigger?
      description: Example user prompts or situations.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Expected scope
      description: Scripts, references, tests, or external APIs involved.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this skill
          required: false
